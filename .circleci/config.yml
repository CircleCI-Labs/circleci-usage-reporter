version: 2.1

# URL orb (config reference: orbs.<name> is an https string, not a url: map).
# Org must allow-list https://raw.githubusercontent.com/CircleCI-Labs/circleci-usage-reporter/
# Pipeline parameters are not visible inside the orb; pass python-image at each call.
orbs:
  tf-schedule: https://raw.githubusercontent.com/CircleCI-Labs/circleci-usage-reporter/<< pipeline.git.revision >>/.circleci/orbs/tf-schedule.yml

parameters:
  org_id:
    type: string
    default: ${CIRCLE_ORGANIZATION_ID}
  cost_per_credit:
    type: string
    default: "0.0006"
  job_name:
    type: string
    default: "unit_tests"
  python-image:
    type: string
    default: cimg/python:3.13.1
  run-weekly-usage:
    type: boolean
    default: false
  apply-schedule:
    type: boolean
    default: false
  pipeline-definition-id:
    type: string
    default: ""

jobs:
  generate-usage-report:
    executor:
      name: tf-schedule/python-large
      image: << pipeline.parameters.python-image >>
    steps:
      - checkout
      - tf-schedule/install-requirements
      - tf-schedule/get-previous-month-usage:
          org-id: << pipeline.parameters.org_id >>
      - tf-schedule/run-create-graph
      - persist_to_workspace:
          root: /tmp/reports
          paths:
            - merged.csv
      - store_artifacts:
          path: /tmp/reports

  send-metrics-to-datadog:
    executor:
      name: tf-schedule/python-small
      image: << pipeline.parameters.python-image >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - tf-schedule/install-requirements
      - run:
          name: Send metrics to Datadog
          command: circleci-usage-reporter send-to-datadog /tmp/merged.csv

  generate-analysis:
    parameters:
      analysis-type:
        type: string
    executor:
      name: tf-schedule/python-large
      image: << pipeline.parameters.python-image >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - tf-schedule/run-analysis-report:
          analysis-type: << parameters.analysis-type >>
          job-name: << pipeline.parameters.job_name >>
          cost-per-credit: << pipeline.parameters.cost_per_credit >>
      - persist_to_workspace:
          root: /tmp
          paths: reports

  gather-artifacts:
    executor:
      name: tf-schedule/python-small
      image: << pipeline.parameters.python-image >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - store_artifacts:
          path: /tmp/reports

  send-metrics-to-doit:
    executor:
      name: tf-schedule/python-small
      image: << pipeline.parameters.python-image >>
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - tf-schedule/install-python-deps:
          pip: pip3
      - run:
          name: Send metrics to DoiT
          command: circleci-usage-reporter send-to-doit /tmp/merged.csv

  weekly-store-metrics:
    executor:
      name: tf-schedule/python-large
      image: << pipeline.parameters.python-image >>
    steps:
      - checkout
      - tf-schedule/install-requirements
      - tf-schedule/get-previous-week-usage:
          org-id: << pipeline.parameters.org_id >>
      - tf-schedule/run-store-metrics

workflows:
  test:
    when: not (pipeline.parameters.run-weekly-usage or pipeline.parameters.apply-schedule)
    jobs:
      - tf-schedule/lint-and-test:
          python-image: << pipeline.parameters.python-image >>
      - tf-schedule/cli-smoke-test:
          python-image: << pipeline.parameters.python-image >>

  weekly-usage:
    when: pipeline.parameters.run-weekly-usage
    jobs:
      - generate-usage-report:
          context: &my-context
            - my-context
      - generate-analysis:
          name: generate-job-analysis
          analysis-type: job
          requires:
            - generate-usage-report
      - generate-analysis:
          name: generate-project-analysis
          analysis-type: project
          requires:
            - generate-usage-report
      - generate-analysis:
          name: generate-compute-credits-analysis
          analysis-type: compute-credits
          requires:
            - generate-usage-report
      - generate-analysis:
          name: generate-resource-class-analysis
          analysis-type: resource
          requires:
            - generate-usage-report
      - gather-artifacts:
          requires:
            - generate-job-analysis: terminal
            - generate-project-analysis: terminal
            - generate-compute-credits-analysis: terminal
            - generate-resource-class-analysis: terminal
      - weekly-store-metrics:
          context: *my-context
      - tf-schedule/weekly-top-usage:
          context: &circle-token-cci-labs
            - circle-token-cci-labs
          python-image: << pipeline.parameters.python-image >>

  apply-tf-schedule:
    when: pipeline.parameters.apply-schedule
    jobs:
      - tf-schedule/apply:
          context: *circle-token-cci-labs
          pipeline-id: << pipeline.parameters.pipeline-definition-id >>
