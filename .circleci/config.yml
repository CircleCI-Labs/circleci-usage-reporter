version: 2.1

# URL orb (config reference: orbs.<name> is an https string, not a url: map).
# Org must allow-list https://raw.githubusercontent.com/CircleCI-Labs/circleci-usage-reporter/
orbs:
  tf-schedule: https://raw.githubusercontent.com/CircleCI-Labs/circleci-usage-reporter/<< pipeline.git.revision >>/.circleci/orbs/tf-schedule.yml

parameters:
  org_id:
    type: string
    default: ${CIRCLE_ORGANIZATION_ID}
  cost_per_credit:
    type: string
    default: "0.0006"
  job_name:
    type: string
    default: "unit_tests"
  python-image:
    type: string
    default: cimg/python:3.13.1
  run-weekly-usage:
    type: boolean
    default: false
  apply-schedule:
    type: boolean
    default: false
  pipeline-definition-id:
    type: string
    default: ""

executors:
  python-small:
    docker:
      - image: << pipeline.parameters.python-image >>
    resource_class: small.gen2
  python-large:
    docker:
      - image: << pipeline.parameters.python-image >>
    resource_class: large.gen2

commands:
  install-requirements:
    description: "Install Python dependencies from requirements.txt with caching"
    steps:
      - restore_cache:
          keys:
            - pip-deps-v1-{{ checksum "requirements.txt" }}
            - pip-deps-v1-
      - run:
          name: Install dependencies
          command: |
            pip install --user -r requirements.txt
            pip install --user -e .
      - save_cache:
          key: pip-deps-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.local/lib/python3.13/site-packages

  install-all-deps:
    description: "Install all dependencies (requirements + analysis) with caching"
    steps:
      - restore_cache:
          keys:
            - system-deps-v1-{{ checksum "requirements.txt" }}-jupyter
            - system-deps-v1-
      - run:
          name: Install Python dependencies
          command: |
            pip3 install -r requirements.txt
            pip3 install -e .
      - run:
          name: Install Jupyter
          command: |
            pip3 install jupyter nbconvert
      - save_cache:
          key: system-deps-v1-{{ checksum "requirements.txt" }}-jupyter
          paths:
            - /usr/local/lib/python3.13/dist-packages

  verify-merged-data:
    description: "Verify merged data file exists"
    steps:
      - run:
          name: Verify merged data file exists
          command: |
            ls -la /tmp/merged.csv
            echo "Using merged file directly from workspace at /tmp/merged.csv"

  run-analysis:
    description: "Run analysis script with parameters"
    parameters:
      analysis_type:
        type: string
    steps:
      - run:
          name: Execute << parameters.analysis_type >> analysis
          command: |
            if [ "<< pipeline.parameters.job_name >>" != "" ]; then
              circleci-usage-reporter run-analysis --type << parameters.analysis_type >> --job << pipeline.parameters.job_name >> --credit-cost << pipeline.parameters.cost_per_credit >> --input /tmp/merged.csv
            else
              circleci-usage-reporter run-analysis --type << parameters.analysis_type >> --credit-cost << pipeline.parameters.cost_per_credit >> --input /tmp/merged.csv
            fi

jobs:
  lint-and-test:
    executor: python-small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -e . && pip install pytest pytest-cov flake8
      - run:
          name: Linting
          command: make lint
      - run:
          name: Testing with coverage
          environment:
            MPLBACKEND: Agg
          command: |
            mkdir -p test-results
            python -m pytest tests/ -v \
              --cov=src \
              --cov-report=xml:test-results/coverage.xml \
              --cov-report=html:test-results/coverage-html \
              --cov-fail-under=50 \
              --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results/junit.xml
      - store_artifacts:
          path: test-results/coverage-html/index.html
          destination: coverage-report/index.html

  cli-smoke-test:
    executor: python-small
    steps:
      - checkout
      - run:
          name: Install package
          command: pip install -e .
      - run:
          name: Verify CLI entry point
          command: circleci-usage-reporter --help
      - run:
          name: Verify all subcommands respond to --help
          command: |
            circleci-usage-reporter get --help
            circleci-usage-reporter merge --help
            circleci-usage-reporter send-to-datadog --help
            circleci-usage-reporter send-to-doit --help
            circleci-usage-reporter create-graph --help
            circleci-usage-reporter run-analysis --help
            circleci-usage-reporter store-metrics --help
            circleci-usage-reporter top-workflows --help
            circleci-usage-reporter top-jobs --help

  generate-usage-report:
    executor: python-large
    steps:
      - checkout
      - install-requirements
      - tf-schedule/set-previous-month-dates
      - run:
          environment:
            ORG_ID: << pipeline.parameters.org_id >>
          name: Get Usage Report
          command: |
            ORG_ID="$(echo "${ORG_ID}" | circleci env subst)"
            circleci-usage-reporter get --org-id "$ORG_ID" --start-date "$START_DATE" --end-date "$END_DATE" --output /tmp/reports/merged.csv
      - run:
          name: Create a graph from the merged data
          command: |
            circleci-usage-reporter create-graph /tmp/reports/merged.csv
      - persist_to_workspace:
          root: /tmp/reports
          paths:
            - merged.csv
      - store_artifacts:
          path: /tmp/reports

  send-metrics-to-datadog:
    executor: python-small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - install-requirements
      - run:
          name: Send metrics to Datadog
          command: circleci-usage-reporter send-to-datadog /tmp/merged.csv

  generate-job-analysis:
    executor: python-large
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - install-all-deps
      - verify-merged-data
      - run-analysis:
          analysis_type: "job"
      - persist_to_workspace:
          root: /tmp
          paths: reports

  generate-project-analysis:
    executor: python-large
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - install-all-deps
      - verify-merged-data
      - run-analysis:
          analysis_type: "project"
      - persist_to_workspace:
          root: /tmp
          paths: reports

  generate-compute-credits-analysis:
    executor: python-large
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - install-all-deps
      - verify-merged-data
      - run-analysis:
          analysis_type: "compute-credits"
      - persist_to_workspace:
          root: /tmp
          paths: reports

  generate-resource-class-analysis:
    executor: python-large
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - install-all-deps
      - verify-merged-data
      - run-analysis:
          analysis_type: "resource"
      - persist_to_workspace:
          root: /tmp
          paths: reports

  gather-artifacts:
    executor: python-small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - store_artifacts:
          path: /tmp/reports

  send-metrics-to-doit:
    executor: python-small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Install dependencies
          command: |
            pip3 install -r requirements.txt
            pip3 install -e .
      - run:
          name: Send metrics to DoiT
          command: |
            circleci-usage-reporter send-to-doit /tmp/merged.csv

  weekly-store-metrics:
    executor: python-large
    steps:
      - checkout
      - install-requirements
      - run:
          name: Download previous week's usage report
          environment:
            ORG_ID: << pipeline.parameters.org_id >>
          command: |
            ORG_ID="$(echo "${ORG_ID}" | circleci env subst)"
            START_DATE="$(date -u -d 'last monday - 7 days' +%Y-%m-%d)"
            END_DATE="$(date -u -d 'last monday' +%Y-%m-%d)"
            circleci-usage-reporter get \
              --org-id "$ORG_ID" \
              --start-date "$START_DATE" \
              --end-date "$END_DATE" \
              --output /tmp/reports/merged.csv
      - run:
          name: Store metrics in Postgres and Prometheus
          command: |
            circleci-usage-reporter store-metrics /tmp/reports/merged.csv \
              --previous-week \
              --replace

  # Live Usage API export is rate-limited to 10 POSTs/hour/org.
  weekly-top-usage:
    executor: python-large
    steps:
      - checkout
      - install-requirements
      - run:
          name: Rank top workflows and jobs
          no_output_timeout: 3m
          command: |
            circleci-usage-reporter top-workflows --project-id "$CIRCLE_PROJECT_ID"
            circleci-usage-reporter top-jobs --project-id "$CIRCLE_PROJECT_ID"

workflows:
  test:
    when: not (pipeline.parameters.run-weekly-usage or pipeline.parameters.apply-schedule)
    jobs:
      - lint-and-test
      - cli-smoke-test

  weekly-usage:
    when: pipeline.parameters.run-weekly-usage
    jobs:
      - generate-usage-report:
          context:
            - my-context
      - generate-job-analysis:
          requires:
            - generate-usage-report
      - generate-project-analysis:
          requires:
            - generate-usage-report
      - generate-compute-credits-analysis:
          requires:
            - generate-usage-report
      - generate-resource-class-analysis:
          requires:
            - generate-usage-report
      - gather-artifacts:
          requires:
            - generate-job-analysis: terminal
            - generate-project-analysis: terminal
            - generate-compute-credits-analysis: terminal
            - generate-resource-class-analysis: terminal
      - weekly-store-metrics:
          context:
            - my-context
      - weekly-top-usage:
          context:
            - circle-token-cci-labs

  apply-tf-schedule:
    when: pipeline.parameters.apply-schedule
    jobs:
      - tf-schedule/apply:
          context:
            - circle-token-cci-labs
          pipeline-id: << pipeline.parameters.pipeline-definition-id >>
