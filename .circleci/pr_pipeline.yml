# Unit tests and CLI smoke tests only. Do not add a live Usage API export here —
# that endpoint is limited to 10 requests/hour/org. Live top-workflows/top-jobs
# run on the weekly schedule trigger in .circleci/config.yml.
#
# Shared jobs/commands live in the URL orb. python-image default is the orb
# executor default (pipeline parameters are not visible inside URL orbs).
# Boolean parameters exist only so this pipeline's when: matches config.yml.

version: 2.1

orbs:
  tf-schedule: https://raw.githubusercontent.com/CircleCI-Labs/circleci-usage-reporter/<< pipeline.git.revision >>/.circleci/orbs/tf-schedule.yml

parameters:
  run-weekly-usage:
    type: boolean
    default: false
  apply-schedule:
    type: boolean
    default: false

workflows:
  testing:
    when: not (pipeline.parameters.run-weekly-usage or pipeline.parameters.apply-schedule)
    jobs:
      - tf-schedule/lint-and-test
      - tf-schedule/cli-smoke-test
      - tf-schedule/build-docker-image
