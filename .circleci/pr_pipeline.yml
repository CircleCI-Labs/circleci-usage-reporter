# Unit tests, CLI smoke, and Docker build only.
# Live top-N (weekly-top-usage) runs on the OAuth config.yml test workflow
# so context circle-token-cci-labs is available. Do not add a Usage export
# job here — one export per hour-window (10/org).
#
# Shared jobs/commands live in the URL orb. python-image default is the orb
# executor default (pipeline parameters are not visible inside URL orbs).
# Boolean parameters exist only so this pipeline's when: matches config.yml.

version: 2.1

orbs:
  usage-reporter: https://raw.githubusercontent.com/CircleCI-Labs/circleci-usage-reporter/<< pipeline.git.revision >>/.circleci/orbs/usage-reporter.yml

parameters:
  run-weekly-usage:
    type: boolean
    default: false
  apply-schedule:
    type: boolean
    default: false

workflows:
  testing:
    when: not (pipeline.parameters.run-weekly-usage or pipeline.parameters.apply-schedule)
    jobs:
      - usage-reporter/lint-and-test
      - usage-reporter/cli-smoke-test
      - usage-reporter/build-docker-image
